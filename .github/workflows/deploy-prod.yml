name: Deploy to prod

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm prod deploy'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.PROD_REGISTRY }}
  IMAGE: gs-frontend
  VITE_API_BASE_URL: https://api.goodsurfing.org
  VITE_MAIN_URL: https://goodsurfing.org
  VITE_VKID_CLIENT_ID: "54505769"

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_MAIN_URL=${{ env.VITE_MAIN_URL }}
            VITE_VKID_CLIENT_ID=${{ env.VITE_VKID_CLIENT_ID }}
            VITE_API_YANDEX_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            # DSN проекта в Bugsink (публичный по природе, попадает в JS); пусто — сбор ошибок выключен
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=prod
            VITE_SENTRY_RELEASE=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:prod
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          # См. тот же provenance: false в deploy-staging.yml — Yandex
          # Container Registry не переваривает OCI attestation-манифест,
          # который buildx с 0.10 добавляет по умолчанию при push.
          provenance: false
          cache-from: type=gha,scope=gs-frontend-prod
          cache-to: type=gha,mode=max,scope=gs-frontend-prod

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/gs
            sudo docker compose pull frontend
            sudo docker compose up -d frontend
            # Старый образ после обновления остаётся «висящим» (1+ ГБ у бэкенда) — без
            # очистки диск стейджа 29.10 заполнился на 90% (142 таких образа)
            sudo docker image prune -f || true

      - name: Smoke test
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 ${{ env.VITE_MAIN_URL }}/)
            if [ "$code" = "200" ]; then echo "frontend OK"; exit 0; fi
            echo "attempt $i -> $code"
            sleep 15
          done
          echo "Frontend smoke test failed"
          exit 1

  # О результате в Telegram пишет бот статуса (gs-status-bot) по GitHub Actions API:
  # сам он держит в чате только последние события, а сообщения workflow копились без конца.
