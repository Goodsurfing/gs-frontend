name: Deploy to staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: cr.yandex/crpspj7jl594r3ekjv50
  IMAGE: gs-frontend
  # build-time env baked into the bundle
  VITE_API_BASE_URL: https://api-staging.goodsurfing.org
  VITE_MAIN_URL: https://staging.goodsurfing.org
  VITE_VKID_CLIENT_ID: "54505769"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_MAIN_URL=${{ env.VITE_MAIN_URL }}
            VITE_VKID_CLIENT_ID=${{ env.VITE_VKID_CLIENT_ID }}
            VITE_API_YANDEX_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            # DSN проекта в Bugsink (публичный по природе, попадает в JS); пусто — сбор ошибок выключен
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=staging
            VITE_SENTRY_RELEASE=develop-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          # buildx с версии 0.10 по умолчанию пушит provenance-attestation
          # доп. манифестом в OCI image index — Yandex Container Registry
          # такой manifest list не переваривает и роняет весь push с
          # "unknown: Cannot read manifest data" (живой сбой на стейдже
          # 2026-08-15, до этого недели пушилось нормально — судя по всему
          # GitHub обновил бандленный buildx на раннерах).
          provenance: false
          cache-from: type=gha,scope=gs-frontend
          cache-to: type=gha,mode=max,scope=gs-frontend

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/gs
            # Две выкладки стейджа (SPA и новый фронт) идут на одну VM параллельно:
            # docker image prune одной может сорвать pull другой («failed to lease content») — повторяем
            for attempt in 1 2 3; do sudo docker compose pull frontend && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
            sudo docker compose up -d frontend
            # Старый образ после обновления остаётся «висящим» (1+ ГБ у бэкенда) — без
            # очистки диск стейджа 29.10 заполнился на 90% (142 таких образа)
            sudo docker image prune -f || true
            sleep 3
            sudo docker compose ps frontend

      - name: Smoke test
        run: |
          set -e
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://staging.goodsurfing.org/healthz)
            if [ "$code" = "200" ]; then echo "frontend OK"; exit 0; fi
            echo "attempt $i → $code"
            sleep 10
          done
          echo "Frontend smoke test failed"
          exit 1

  # О результате в Telegram пишет бот статуса (gs-status-bot) по GitHub Actions API:
  # сам он держит в чате только последние события, а сообщения workflow копились без конца.
