name: Deploy web (новый фронт) to prod

# Новый фронт (эпик GS-212) на проде за канарейкой: Traefik отправляет в
# него запрос только с cookie gs_web=1 (gs-infra envs/prod/cloud-init.yaml,
# сервис web). С 03.11.2026 новый фронт видят все, старое SPA — только админка. Выкатывается тем
# же тегом релиза, что и старое SPA (deploy-prod.yml).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm prod deploy'
        required: true

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.PROD_REGISTRY }}
  IMAGE: gs-web
  SITE_URL: https://goodsurfing.org

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_API_URL=https://api.goodsurfing.org
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=prod
            NEXT_PUBLIC_SENTRY_RELEASE=web-${{ github.ref_name }}
            NEXT_PUBLIC_YANDEX_MAPS_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            # Тот же счётчик Метрики, что у старого фронта; на стенде не задан
            NEXT_PUBLIC_YANDEX_METRIKA_ID=47422282
            # Приложение VK ID — то же, что у старого фронта (VITE_VKID_CLIENT_ID в deploy-prod.yml)
            NEXT_PUBLIC_VKID_CLIENT_ID=54505769
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:prod
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          # Yandex CR не принимает provenance-манифесты (см. deploy-prod.yml)
          provenance: false
          cache-from: type=gha,scope=gs-web-prod
          cache-to: type=gha,mode=max,scope=gs-web-prod

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/gs
            # Старое SPA выкатывается тем же тегом параллельно: prune одной выкладки
            # может сорвать pull другой («failed to lease content») — повторяем
            for attempt in 1 2 3; do sudo docker compose pull web && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
            # Выкатка без простоя: новый контейнер поднимается рядом со старым; Traefik начинает слать
            # на него запросы, когда он здоров (healthcheck образа), и только потом старый останавливается.
            # Раньше «up -d» сначала гасил старый — на 1–8 с сайт/API отвечали 404 (06.11.2026).
            S=web
            OLD=$(sudo docker compose ps -q $S)
            sudo docker compose up -d --no-deps --no-recreate --scale $S=2 $S
            NEW=$(sudo docker compose ps -q $S | grep -v -x -F "${OLD:-none}" | head -1)
            [ -n "$NEW" ] || { echo "новый контейнер $S не создан"; exit 1; }
            ok=""; st=""
            for i in $(seq 1 60); do
              st=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$NEW")
              if [ "$st" = healthy ]; then ok=1; break; fi
              if [ "$st" = unhealthy ] || [ "$st" = exited ]; then break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "новый контейнер $S не стал здоровым ($st) — оставляем старый"
              sudo docker logs --tail 80 "$NEW" || true
              sudo docker rm -f "$NEW"
              exit 1
            fi
            # Пара секунд, чтобы Traefik подхватил новый; дольше не ждём — пока работают оба,
            # страница от новой версии может запросить свои файлы у старой
            sleep 2
            if [ -n "$OLD" ]; then sudo docker stop -t 30 $OLD; sudo docker rm $OLD; fi
            sudo docker compose up -d --no-deps --no-recreate --scale $S=1 $S
            sudo docker image prune -f || true
            sleep 5
            sudo docker compose ps web
            # Прогрев кэша (ISR): новый контейнер начинает с пустым кэшем, и первый обход
            # поисковиком рендерил бы каждую вакансию заново (04.11 — до 7 с на страницу).
            # Обходим адреса из sitemap по одному с паузой — примерно половина ядра, чтобы
            # не мешать посетителям; в фоне на VM, без ожидания в Actions. Журнал —
            # /tmp/gs-cache-warmup.log.
            setsid nohup bash -c 'sleep 20; for m in vacancies organizations content; do curl -s -m 30 https://goodsurfing.org/sitemap-$m.xml | grep -o "<loc>[^<]*" | sed "s/<loc>//"; done | while read -r url; do curl -s -o /dev/null -m 30 -A gs-cache-warmup "$url"; sleep 0.3; done; echo "прогрев завершён $(date -Is)"' > /tmp/gs-cache-warmup.log 2>&1 < /dev/null &

      - name: Smoke test (через канарейку)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 -H 'Cookie: gs_web=1' ${{ env.SITE_URL }}/healthz || true)
            if echo "$body" | grep -q '"service":"web"'; then echo "web OK"; exit 0; fi
            echo "attempt $i → $body"
            sleep 10
          done
          echo "Новый фронт не ответил через канарейку"
          exit 1

      - name: Без cookie — новый фронт, админка отвечает
        run: |
          # С 03.11.2026 новый фронт открыт всем (роутер web-all в Traefik); с 04.11 и админка — в новом фронте (GS-221),
          # на проде переключается Traefik после выкатки — поэтому проверяем только, что /admin отвечает
          body=$(curl -s -m 10 ${{ env.SITE_URL }}/healthz)
          if ! echo "$body" | grep -q '"service":"web"'; then echo "Без cookie /healthz отвечает не новый фронт: $body"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 ${{ env.SITE_URL }}/admin)
          if [ "$code" != "200" ]; then echo "/admin отвечает $code"; exit 1; fi
          echo "новый фронт для всех, /admin отвечает: OK"
