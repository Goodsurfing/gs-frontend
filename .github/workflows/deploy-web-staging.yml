name: Deploy web (новый фронт) to staging

# Новый фронт (эпик GS-212) на стейдже. С 03.11.2026 Traefik отправляет в
# него все перенесённые адреса (роутер web-all); старое SPA — только админка.

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'public/locales/**'
      - '.github/workflows/deploy-web-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

env:
  REGISTRY: cr.yandex/crpspj7jl594r3ekjv50
  IMAGE: gs-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://staging.goodsurfing.org
            NEXT_PUBLIC_API_URL=https://api-staging.goodsurfing.org
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_RELEASE=web-develop-${{ github.sha }}
            NEXT_PUBLIC_YANDEX_MAPS_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            # Приложение VK ID — то же, что у старого фронта (VITE_VKID_CLIENT_ID в deploy-staging.yml)
            NEXT_PUBLIC_VKID_CLIENT_ID=54505769
            # Полоса «Тестовая версия» и «Сообщить о проблеме» → бот «Клуба первых» (на проде не задаётся)
            NEXT_PUBLIC_TEST_BOT=goodsurfing_testing_bot
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          # Yandex CR не принимает provenance-манифесты (см. deploy-staging.yml)
          provenance: false
          cache-from: type=gha,scope=gs-web
          cache-to: type=gha,mode=max,scope=gs-web

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/gs
            # Две выкладки стейджа (SPA и новый фронт) идут на одну VM параллельно:
            # docker image prune одной может сорвать pull другой («failed to lease content») — повторяем
            for attempt in 1 2 3; do sudo docker compose pull web && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
            # Выкатка без простоя: новый контейнер поднимается рядом со старым; Traefik начинает слать
            # на него запросы, когда он здоров (healthcheck образа), и только потом старый останавливается.
            # Раньше «up -d» сначала гасил старый — на 1–8 с сайт/API отвечали 404 (06.11.2026).
            S=web
            OLD=$(sudo docker compose ps -q $S)
            sudo docker compose up -d --no-deps --no-recreate --scale $S=2 $S
            NEW=$(sudo docker compose ps -q $S | grep -v -x -F "${OLD:-none}" | head -1)
            [ -n "$NEW" ] || { echo "новый контейнер $S не создан"; exit 1; }
            ok=""; st=""
            for i in $(seq 1 60); do
              st=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$NEW")
              if [ "$st" = healthy ]; then ok=1; break; fi
              if [ "$st" = unhealthy ] || [ "$st" = exited ]; then break; fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "новый контейнер $S не стал здоровым ($st) — оставляем старый"
              sudo docker logs --tail 80 "$NEW" || true
              sudo docker rm -f "$NEW"
              exit 1
            fi
            # Пара секунд, чтобы Traefik подхватил новый; дольше не ждём — пока работают оба,
            # страница от новой версии может запросить свои файлы у старой
            sleep 2
            if [ -n "$OLD" ]; then sudo docker stop -t 30 $OLD; sudo docker rm $OLD; fi
            sudo docker compose up -d --no-deps --no-recreate --scale $S=1 $S
            # Старый образ после обновления остаётся «висящим» (1+ ГБ у бэкенда) — без
            # очистки диск стейджа 29.10 заполнился на 90% (142 таких образа)
            sudo docker image prune -f || true
            sleep 5
            sudo docker compose ps web
            # Прогрев кэша (как на проде) здесь не запускаем: сразу после выкатки идёт e2e, а
            # слабой VM стейджа (2 vCPU по 50 %) прогрев отнимал процессор — 04.11 e2e падали по таймаутам

      - name: Smoke test (через канарейку)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 -H 'Cookie: gs_web=1' https://staging.goodsurfing.org/healthz || true)
            if echo "$body" | grep -q '"service":"web"'; then echo "web OK"; exit 0; fi
            echo "attempt $i → $body"
            sleep 10
          done
          echo "Новый фронт не ответил через канарейку"
          exit 1
      - name: Без cookie — новый фронт, админка отвечает
        run: |
          # С 03.11.2026 новый фронт открыт всем (роутер web-all в Traefik); с 04.11 и админка — в новом фронте (GS-221),
          # на проде переключается Traefik после выкатки — поэтому проверяем только, что /admin отвечает
          body=$(curl -s -m 10 https://staging.goodsurfing.org/healthz)
          if ! echo "$body" | grep -q '"service":"web"'; then echo "Без cookie /healthz отвечает не новый фронт: $body"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://staging.goodsurfing.org/admin)
          if [ "$code" != "200" ]; then echo "/admin отвечает $code"; exit 1; fi
          echo "новый фронт для всех, /admin отвечает: OK"
