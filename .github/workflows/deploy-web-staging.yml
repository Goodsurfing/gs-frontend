name: Deploy web (новый фронт) to staging

# Новый фронт (эпик GS-212) на стейдже. С 03.11.2026 Traefik отправляет в
# него все перенесённые адреса (роутер web-all); старое SPA — только админка.

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'public/locales/**'
      - '.github/workflows/deploy-web-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

env:
  REGISTRY: cr.yandex/crpspj7jl594r3ekjv50
  IMAGE: gs-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://staging.goodsurfing.org
            NEXT_PUBLIC_API_URL=https://api-staging.goodsurfing.org
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_RELEASE=web-develop-${{ github.sha }}
            NEXT_PUBLIC_YANDEX_MAPS_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            # Приложение VK ID — то же, что у старого фронта (VITE_VKID_CLIENT_ID в deploy-staging.yml)
            NEXT_PUBLIC_VKID_CLIENT_ID=54505769
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          # Yandex CR не принимает provenance-манифесты (см. deploy-staging.yml)
          provenance: false
          cache-from: type=gha,scope=gs-web
          cache-to: type=gha,mode=max,scope=gs-web

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/gs
            # Две выкладки стейджа (SPA и новый фронт) идут на одну VM параллельно:
            # docker image prune одной может сорвать pull другой («failed to lease content») — повторяем
            for attempt in 1 2 3; do sudo docker compose pull web && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
            sudo docker compose up -d web
            # Старый образ после обновления остаётся «висящим» (1+ ГБ у бэкенда) — без
            # очистки диск стейджа 29.10 заполнился на 90% (142 таких образа)
            sudo docker image prune -f || true
            sleep 5
            sudo docker compose ps web
            # Прогрев кэша (ISR): новый контейнер начинает с пустым кэшем, и первый обход
            # поисковиком рендерил бы каждую вакансию заново (04.11 — до 7 с на страницу).
            # Обходим адреса из sitemap по одному с паузой — примерно половина ядра, чтобы
            # не мешать посетителям; в фоне на VM, без ожидания в Actions. Журнал —
            # /tmp/gs-cache-warmup.log.
            setsid nohup bash -c 'sleep 20; for m in vacancies organizations content; do curl -s -m 30 https://staging.goodsurfing.org/sitemap-$m.xml | grep -o "<loc>[^<]*" | sed "s/<loc>//"; done | while read -r url; do curl -s -o /dev/null -m 30 -A gs-cache-warmup "$url"; sleep 0.3; done; echo "прогрев завершён $(date -Is)"' > /tmp/gs-cache-warmup.log 2>&1 < /dev/null &

      - name: Smoke test (через канарейку)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 10 -H 'Cookie: gs_web=1' https://staging.goodsurfing.org/healthz || true)
            if echo "$body" | grep -q '"service":"web"'; then echo "web OK"; exit 0; fi
            echo "attempt $i → $body"
            sleep 10
          done
          echo "Новый фронт не ответил через канарейку"
          exit 1
      - name: Без cookie — новый фронт, админка — старое SPA
        run: |
          # С 03.11.2026 новый фронт открыт всем (роутер web-all в Traefik); в старом SPA осталась только админка
          body=$(curl -s -m 10 https://staging.goodsurfing.org/healthz)
          if ! echo "$body" | grep -q '"service":"web"'; then echo "Без cookie /healthz отвечает не новый фронт: $body"; exit 1; fi
          admin=$(curl -s -m 10 https://staging.goodsurfing.org/admin)
          if echo "$admin" | grep -q '/_next/'; then echo "/admin отдаёт новый фронт — админка должна остаться в старом SPA"; exit 1; fi
          echo "новый фронт для всех, админка — старое SPA: OK"
