name: E2E staging

# Сквозная проверка стейджа как пользователь: вход, карта, отклик и переписка
# с организатором, оплата членства тестовой картой ЮKassa. Ловит то, что
# не видят юнит-тесты: поломки на стыке фронта, бэка, конфигов и внешних
# сервисов. Данные стейджа не очищаются (E2E_RESET не задан) — сценарии
# работают на обычной копии прода с одноразовыми @test.local пользователями.

on:
  workflow_run:
    workflows: ['Deploy to staging']
    types: [completed]
  workflow_dispatch:
  schedule:
    # 04:30 UTC = 07:30 МСК: после ночного restore (06:00) и включения VM (06:55)
    - cron: '30 4 * * *'

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 20 мин на тесты (сейчас ~9–17) + до 10 мин ожидания выкатки нового фронта
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for staging deploys to finish
        # Запуск — по окончании «Deploy to staging» (старое SPA, ~1,5 мин), а выкатка
        # нового фронта идёт ещё 3–4 мин и пересоздаёт его контейнер посреди тестов:
        # 502 и «упавшие с первой попытки» (04.11.2026). Ждём, пока выкатки закончатся.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            busy=$(gh run list -R "$GITHUB_REPOSITORY" -b develop -L 20 --json workflowName,status \
              -q '[.[] | select((.workflowName == "Deploy web (новый фронт) to staging" or .workflowName == "Deploy to staging") and .status != "completed")] | length')
            [ "$busy" = "0" ] && exit 0
            echo "Идёт выкатка на стейдж ($busy), ждём…"; sleep 10
          done
          echo "Выкатка не закончилась за 10 минут — запускаем тесты как есть"

      - uses: actions/checkout@v7
        with:
          ref: develop

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for staging to answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://api-staging.goodsurfing.org/api/v1/membership/tariffs" || true)
            [ "$code" = "200" ] && exit 0
            echo "staging API: $code, ждём…"; sleep 10
          done
          echo "Стейдж не ответил за 5 минут"; exit 1

      - name: Run E2E
        run: npx playwright test --reporter=list,html
        env:
          # Письма стейджа уходят в Mailpit (GS-204) — регистрация и сброс пароля читают их оттуда
          MAILPIT_USER: ${{ secrets.MAILPIT_USER }}
          MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
          # /api/test/* стейджа закрыты токеном (gs-backend #439)
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
          E2E_USERS_PASSWORD: ${{ secrets.E2E_USERS_PASSWORD }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # О результате в Telegram пишет бот статуса (gs-status-bot) по GitHub Actions API:
  # сам он держит в чате только последние события, а сообщения workflow копились без конца.
