name: Lint

on:
  pull_request:
  push:
    branches: [main, master, develop, dev]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Раньше тесты в CI не запускались совсем, и 23 файла незаметно сломались
      # из-за пропавшей зависимости @testing-library/dom.
      - name: Unit tests
        run: npm run test:run

      # Известные уязвимости в зависимостях, которые попадают в сборку.
      # Пока не блокирует: остались swiper/react-router/tiptap, их закрывают
      # мажорные обновления (см. docs/roadmap). Потом — убрать continue-on-error.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  secrets:
    # Действующие токены и ключи, случайно попавшие в коммит.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

