name: Lint

on:
  pull_request:
  push:
    branches: [main, master, develop, dev]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Раньше тесты в CI не запускались совсем, и 23 файла незаметно сломались
      # из-за пропавшей зависимости @testing-library/dom.
      - name: Unit tests
        run: npm run test:run

      # Известные уязвимости в зависимостях, которые попадают в сборку.
      # Блокирует на moderate и выше. Сейчас остаётся одна low (deepmerge через
      # react-player и babel-plugin-i18next-extract, исправления нет) — её пропускаем.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  secrets:
    # Действующие токены и ключи, случайно попавшие в коммит.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

