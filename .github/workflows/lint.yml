name: Lint

on:
  pull_request:
  push:
    branches: [main, master, develop, dev]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Корень — только сквозные E2E (e2e/): старое SPA удалено 05.11.2026 (GS-222),
      # новый фронт проверяет web.yml. Здесь — что тесты собираются и уязвимости корня.
      - name: E2E type-check
        run: npm run e2e:typecheck

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  secrets:
    # Действующие токены и ключи, случайно попавшие в коммит.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

